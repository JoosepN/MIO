<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>MIO: My Image Optimizer</title>
    <meta name="description" content="Make a whole batch of images smaller in your browser. No limits, and nothing is uploaded.">
    <style>
        body { margin: 0; background: #f4f4f5; color: #18181b; font-family: system-ui, -apple-system, sans-serif; }
        main { max-width: 56rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
        h1 { margin: 0; font-size: 2.25rem; line-height: 1.2; letter-spacing: -0.025em; }
        main > p { margin: 0.75rem 0 1.5rem; max-width: 42rem; font-size: 1.125rem; line-height: 1.75rem; opacity: 0.8; }
        @media (prefers-color-scheme: dark) { body { background: #0b0b0c; color: #f0f0f2; } }
    </style>
    <script type="module" src="/ui/main.js"></script>
</head>
<body>
    <main>
        <h1>MIO</h1>
        <p>Make a whole batch of images smaller, tuned for the web. No limits, and everything runs in your browser, so nothing is uploaded.</p>
        <!-- mio:tool -->
    </main>
</body>
</html>
